# ─────────────────────────────────────────────
# RIPS Guard — Railway Deploy Config
# Deploy en 1 click: https://railway.app/new
# ─────────────────────────────────────────────

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Variables de entorno requeridas en Railway Dashboard:
# SUPABASE_URL          → https://xxx.supabase.co
# SUPABASE_JWT_SECRET   → JWT Secret (Supabase → Settings → API)
# SUPABASE_SERVICE_KEY  → service_role key (Supabase → Settings → API)
# ANTHROPIC_API_KEY     → sk-ant-...
# ALLOWED_ORIGINS       → https://www.ripsguard.com,https://ripsguard.com
# ENV                   → production
#
# Pagos: Bold.co se integra en el frontend (Next.js) — no requiere clave en Railway.
